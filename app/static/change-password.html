<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비밀번호 변경 · 업적평가</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">
  <main class="auth-card">
    <h1>비밀번호 변경</h1>
    <p class="sub">처음 로그인했거나 비밀번호가 초기화된 경우 새 비밀번호를 설정해야 합니다.</p>
    <form id="pw-form" novalidate>
      <label>현재 비밀번호
        <input id="current" type="password" autocomplete="current-password" required autofocus>
      </label>
      <label>새 비밀번호
        <input id="new" type="password" autocomplete="new-password" required>
      </label>
      <label>새 비밀번호 확인
        <input id="confirm" type="password" autocomplete="new-password" required>
      </label>
      <p class="auth-help">8자 이상, 영문과 숫자 포함, 아이디(사번) 포함 불가</p>
      <p id="error" class="form-error" role="alert"></p>
      <button type="submit" id="submit">변경</button>
    </form>
    <p class="auth-help"><a href="/auth/logout">로그아웃</a></p>
  </main>
  <script>
    document.getElementById("pw-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("error");
      const val = (id) => document.getElementById(id).value;
      err.textContent = "";
      if (val("new") !== val("confirm")) {
        err.textContent = "새 비밀번호가 일치하지 않습니다.";
        return;
      }
      const res = await fetch("/auth/change-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ current_password: val("current"), new_password: val("new") }),
      });
      const body = await res.json().catch(() => ({}));
      if (res.status === 401) { location.href = "/login"; return; }
      if (!res.ok) { err.textContent = body.detail || "변경에 실패했습니다."; return; }
      location.href = body.redirect;
    });
  </script>
</body>
</html>
